<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 140" width="880" height="140">
  <defs>
    <style>
      .bg-panel { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 6; }
      .label { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #8b949e; letter-spacing: 0.14em; text-transform: uppercase; }
      .name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 800; fill: #f0f6fc; letter-spacing: -0.02em; }
      .asterisk { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 900; fill: #e11d48; }
      .role { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #e6edf3; letter-spacing: 0.08em; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #fb7185; }
      .tag-bg { fill: #2d1218; stroke: #4c111a; stroke-width: 1; rx: 4; }
      .dot { fill: #e11d48; }
    </style>
  </defs>

  <rect width="880" height="140" class="bg-panel" />

  <!-- Top Metadata Bar -->
  <text x="24" y="32" class="label">SYSTEM IDENTITY // 01</text>
  <circle cx="848" cy="28" r="4" class="dot" />
  <text x="730" y="32" class="label">ACTIVE STATUS</text>

  <!-- Main Headline -->
  <text x="24" y="78" class="asterisk">✳</text>
  <text x="50" y="78" class="name">ANTONIO HELLÍN</text>
  <text x="360" y="78" class="role">/ SOFTWARE ENGINEER</text>

  <!-- Tags / Focus -->
  <rect x="24" y="96" width="135" height="22" class="tag-bg" />
  <text x="32" y="111" class="tag">C++ &amp; QT SYSTEMS</text>

  <rect x="167" y="96" width="155" height="22" class="tag-bg" />
  <text x="175" y="111" class="tag">OPTICAL TRACKING SDK</text>

  <rect x="330" y="96" width="145" height="22" class="tag-bg" />
  <text x="338" y="111" class="tag">LLMOPS &amp; RAG ARCH</text>

  <text x="712" y="111" class="label">AMSTERDAM, NL</text>
</svg>
